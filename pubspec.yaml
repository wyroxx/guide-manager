name: guide_manager
description: "Flutter app with Firebase for managing excursions"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter_riverpod: ^3.3.1
  go_router: ^17.3.0
  flutter_svg: ^2.3.0
  cupertino_icons: ^1.0.9
  google_sign_in: ^7.2.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  build_runner: ^2.5.4
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/launcher_icon.png"
  web:
    generate: true
    image_path: "assets/icons/launcher_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/traveltech.png
    - assets/icons/apple.png
    - assets/icons/google.png
    - assets/images/error.svg
    - assets/images/empty_excursions.svg
    - assets/images/avatar.svg
    - assets/images/empty_profile.svg
    - assets/images/empty_applications.svg
    - assets/icons/launcher_icon.png
